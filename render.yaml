services:
  - type: web
    name: local-tailor-connect
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/import_tamilnadu_locations.py && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
